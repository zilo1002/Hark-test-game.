<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7CCB3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<title>半亩·丰收</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237CCB3E'/%3E%3Cpath d='M10 20q6 -14 12 0z' fill='%23F2486E'/%3E%3Crect x='15' y='19' width='2' height='8' fill='%233E8F25'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hl">
    <div class="lvBadge" id="lvBadge">等级 1</div>
    <div class="goal">
      <div class="gtext" id="goalText"></div>
      <div class="bar"><i id="goalBar"></i><span id="goalNum"></span></div>
      <div class="ordHud hidden" id="ordHud"></div>
      <div class="envHud" id="envHud"><span class="sea hidden" id="envSeason"></span><span class="rain hidden" id="envRain"><i class="cloudIco"></i>雨天 生长+25%</span></div>
    </div>
  </div>
  <div class="hr">
    <div class="coinWrap"><div class="coin" id="coin"><span class="billIco"></span><b id="money">0</b></div><div class="earn" id="earn">&nbsp;</div></div>
    <button class="xbtn" id="btnPause" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>

<div id="hudBottom" class="hudBottom hidden"><div class="hudNote" id="hudNote">&nbsp;</div><div class="stackBadge" id="stackBadge">0/100</div></div>
<div id="tip" class="tip hidden"></div>
<div id="banner" class="banner hidden"><div class="bl" id="bannerLv"></div><div class="bg" id="bannerGoal"></div></div>

<div id="home" class="screen hidden">
  <div id="estateArea" class="estateArea"></div>
  <div class="topbar">
    <div class="tl"><div class="title">我的庄园</div><button class="envChip" id="envChip" aria-label="季节和节日"><b class="sbadge" id="seasonBadge">春</b><b class="fbadge hidden" id="festBadge">节</b></button></div>
    <div class="tr">
      <div class="coinPill" id="coinPill"><i class="gc"></i><b id="coinCount">0</b></div>
      <div class="starPill" id="starPill"><span>★</span><b id="starCount">0</b></div>
      <button class="ibtn shopIco" id="hShop" aria-label="商店"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12.2a1.6 1.6 0 0 1-1.6 1.4H7.8a1.6 1.6 0 0 1-1.6-1.4z" fill="#fff"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button class="ibtn" id="hGear" aria-label="设置"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5-.1-3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.5-1.5L15 1.5h-4l-.4 2.4A8 8 0 0 0 8 5.4l-2.4-.9-2 3.4 2 1.6a8 8 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a8 8 0 0 0 2.5-1.5l2.4.9 2-3.4z"/></svg><em class="dot hidden" id="gearDot"></em></button>
      <button class="ibtn sndIco" id="hSound" aria-label="声音"><svg viewBox="0 0 24 24"><path fill="#fff" d="M3 9h4l5-4v14l-5-4H3z"/><g class="son" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g class="soff" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></g></svg></button>
    </div>
  </div>
  <div class="playBox" id="playBox">
    <button class="big playBtn" id="btnPlay"><span>开始游戏</span><small id="playSub">第 1 关</small></button>
    <button class="small lvlBtn" id="btnLevels">选择关卡</button>
    <button class="small lvlBtn valleyBtn hidden" id="btnValley">四季山谷</button>
  </div>
  <button class="starBtn" id="btnBuild" aria-label="装扮庄园"><svg viewBox="0 0 24 24"><path fill="#FFE14D" stroke="#B87A0A" stroke-width="1.4" stroke-linejoin="round" d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><span>装扮</span><em class="dot hidden" id="buildDot"></em></button>
</div>

<div id="build" class="buildUI hidden">
  <div class="btop">
    <div class="btitle">装扮庄园</div>
    <div class="htabs" id="homeTabs"><button data-p="1">花园庄园</button><button data-p="2">林场牧场</button><button data-p="3">湖畔酒庄</button></div>
    <div class="starPill"><span>★</span><b id="starCount2">0</b></div>
    <button class="small doneBtn" id="btnBuildDone">完成</button>
  </div>
  <div class="tray" id="tray">
    <div class="htabs trayTabs" id="trayTabs"><button data-t="build" class="on">建造 <em id="buildHint"></em></button><button data-t="deco">装饰</button></div>
    <div class="trayBody" id="restoreList"></div>
    <div class="trayNote" id="restoreHint"></div>
  </div>
</div>

<div id="menu" class="modal hidden"><div class="card sheet menuCard">
  <div class="mhead"><h2>设置</h2><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody"><div class="baskets" id="baskets">
    <section class="bk bk-play"><h3>玩法</h3>
      <button class="tile" id="mDaily"><b>每日挑战</b><small id="mDailySub"></small></button>
      <button class="tile" id="mOrders"><b>村民订单</b><small id="mOrdSub"></small><em class="dot hidden" id="ordDot"></em></button>
    </section>
    <section class="bk bk-coll"><h3>收藏</h3>
      <button class="tile" id="mBook"><b>图鉴</b><small id="mBookSub"></small><em class="dot hidden" id="bookDot"></em></button>
      <button class="tile" id="mCrew"><b>雇工</b><small id="mCrewSub"></small></button>
    </section>
    <section class="bk bk-farm"><h3>庄园</h3>
      <button class="tile" id="mBuild"><b>装扮庄园</b><small id="mBuildSub"></small><em class="dot hidden" id="mBuildDot"></em></button>
      <button class="tile info" id="mEnv"><b id="mEnvT">季节</b><small id="mEnvSub"></small></button>
    </section>
    <section class="bk bk-sys"><h3>系统</h3>
      <button class="tile" id="mMode"><b>界面模式</b><small id="mModeSub"></small></button>
      <button class="tile" id="mQual"><b>画质</b><small id="mQualSub"></small></button>
      <button class="tile" id="mSave"><b>震动 · 存档</b><small id="mSaveSub"></small></button>
    </section>
  </div></div>
</div></div>

<div id="envInfo" class="modal hidden"><div class="card sheet">
  <div class="mhead"><h2>季节和节日</h2><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody">
    <div class="season" id="seasonLine"><b class="sbadge" id="seasonBadge2">春</b><span id="seasonText"></span></div>
    <div class="fest hidden" id="festBanner"><b class="fbadge" id="festBadge2">节</b><span id="festText"></span></div>
    <div class="note" id="festNext"></div>
  </div>
  <div class="mfoot"><button class="big" data-close>好的</button></div>
</div></div>

<div id="pause" class="modal hidden"><div class="card sheet">
  <div class="mhead"><h2>暂停</h2></div>
  <div class="mbody"><div class="note center" id="pauseInfo"></div>
  <div class="seaRow hidden" id="pSea"><div class="seaBtns" id="pSeaBtns"></div><span class="fnote" id="pSeaNote"></span></div>
  <div class="brow"><button class="small" id="btnPSettings">设置</button><button class="small" id="btnPLevels">选择关卡</button></div>
  <button class="small warm" id="btnHome">回到庄园</button></div>
  <div class="mfoot"><button class="big" id="btnResume">继续</button></div>
</div></div>

<div id="levels" class="modal hidden"><div class="card sheet wide lvCard">
  <div class="mhead"><h2>选择关卡</h2><div class="htabs" id="lvTabs"></div><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody"><div class="seaRow hidden" id="lvSea"><div class="seaBtns" id="lvSeaBtns"></div><span class="fnote" id="lvSeaNote"></span></div><div class="grid" id="levelGrid"></div></div>
  <div class="mfoot"><span class="fnote" id="lvNote">左右滑动换一页</span><button class="small warm" id="lvGo">继续 第 1 关</button></div>
</div></div>

<div id="settings" class="modal hidden"><div class="card sheet">
  <div class="mhead"><h2>系统设置</h2><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody">
    <label class="row"><span>声音</span><input type="checkbox" id="optSound"><i class="sw"></i></label>
    <label class="row"><span>震动</span><input type="checkbox" id="optVib"><i class="sw"></i></label>
    <div class="rowh">画质</div>
    <div class="seg" id="optQual"><button data-q="auto">自动</button><button data-q="0">低</button><button data-q="1">中</button><button data-q="2">高</button></div>
    <div class="rowh">界面模式 <small id="modeDet"></small></div>
    <div class="seg modes" id="optMode"><button data-m="auto">自动</button><button data-m="phone-p">手机竖屏</button><button data-m="phone-l">手机横屏</button><button data-m="duo">折叠屏 / 双屏</button><button data-m="tab">安卓平板</button><button data-m="ipad">iPad</button></div>
    <div class="note" id="storeNote"></div>
    <button class="small danger" id="btnReset">重置全部进度</button>
  </div>
  <div class="mfoot"><button class="big" data-close>好的</button></div>
</div></div>

<div id="shop" class="modal hidden"><div class="card sheet wide shopCard">
  <div class="mhead"><h2>商店</h2><div class="htabs" id="shopTabs"><button data-t="outfit" class="on">服装</button><button data-t="deco">装饰</button><button data-t="uni">制服</button><button data-t="pet">宠物</button></div><div class="coinPill"><i class="gc"></i><b id="shopCoins">0</b></div><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="shopBody">
    <div class="pv"><canvas id="shopPrev"></canvas></div>
    <div class="mbody sgrid" id="shopGrid"></div>
  </div>
  <div class="mfoot"><div class="pvside"><div class="pvName" id="shopName"></div><div class="pvSub" id="shopSub"></div></div><button class="small warm" id="shopAct">购买</button></div>
  <div class="note hidden" id="shopHow"></div>
</div></div>

<div id="orders" class="modal hidden"><div class="card sheet wide ordCard">
  <div class="mhead"><h2>村民订单</h2><div class="coinPill"><i class="gc"></i><b id="ordCoins">0</b></div><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody ordList" id="ordList"></div>
  <div class="mfoot"><span class="fnote" id="ordNote">每天 3 张新订单。</span></div>
</div></div>

<div id="crew" class="modal hidden"><div class="card sheet wide ordCard">
  <div class="mhead"><h2>我的雇工</h2><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody crewList" id="crewList"></div>
  <div class="mfoot"><span class="fnote">关卡里雇来的工人就是他们（每关轮流上岗）。送货越多等级越高（1 级 +5% → 10 级 +30%）。</span></div>
</div></div>

<div id="book" class="modal hidden"><div class="card sheet wide bookCard">
  <div class="mhead"><h2>图鉴</h2><div class="htabs" id="bookTabs"><button data-p="crops">作物</button><button data-p="animal">动物</button><button data-p="golden">金色</button><button data-p="crew">工人</button></div><div class="bookTot" id="bookTot"></div><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody bgrid" id="bookGrid"></div>
  <div class="mfoot"><span class="fnote" id="bookReward"></span><button class="small warm" id="bookClaim">领取</button></div>
</div></div>

<div id="daily" class="modal hidden"><div class="card sheet dailyCard">
  <div class="mhead"><h2>每日挑战</h2><div class="coinPill"><i class="gc"></i><b id="dailyCoins">0</b></div><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="mbody">
    <div class="dlv" id="dailyLevel"></div>
    <div class="dtw" id="dailyTwist"></div>
    <div class="dtiers" id="dailyTiers"></div>
    <div class="dbest" id="dailyBest"></div>
    <div class="note">3 分钟内赚的钱就是分数。每天一关（用你通过的关卡重新搭配），每档奖励每天领一次，可以反复挑战刷新最佳。</div>
  </div>
  <div class="mfoot"><button class="big" id="btnDailyGo">开始挑战</button></div>
</div></div>

<div id="dailyRes" class="modal hidden"><div class="card win">
  <div class="ribbon" id="drTitle">时间到！</div>
  <div class="medal" id="drMedal"></div>
  <div class="wstat" id="drStat"></div>
  <div class="brow"><button class="small" id="btnDrAgain">再来一次</button><button class="big" id="btnDrHome">回到庄园</button></div>
</div></div>

<div id="win" class="modal hidden"><div class="card win">
  <div class="ribbon" id="winTitle">第 1 关 完成！</div>
  <div class="starsBig" id="winStars"><i></i><i></i><i></i></div>
  <div class="wstat" id="winStat"></div>
  <button class="big" id="btnNext">继续</button>
</div></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
