<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7CCB3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<title>半亩·丰收</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237CCB3E'/%3E%3Cpath d='M10 20q6 -14 12 0z' fill='%23F2486E'/%3E%3Crect x='15' y='19' width='2' height='8' fill='%233E8F25'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hl">
    <div class="lvBadge" id="lvBadge">等级 1</div>
    <div class="goal">
      <div class="gtext" id="goalText"></div>
      <div class="bar"><i id="goalBar"></i><span id="goalNum"></span></div>
      <div class="ordHud hidden" id="ordHud"></div>
    </div>
  </div>
  <div class="hr">
    <div class="coin" id="coin"><span class="billIco"></span><b id="money">0</b></div>
    <button class="xbtn" id="btnPause" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>

<div id="tip" class="tip hidden"></div>
<div id="banner" class="banner hidden"><div class="bl" id="bannerLv"></div><div class="bg" id="bannerGoal"></div></div>

<div id="home" class="screen hidden">
  <div class="topbar">
    <div class="title">我的庄园</div>
    <div class="coinPill" id="coinPill"><i class="gc"></i><b id="coinCount">0</b></div>
    <div class="starPill"><span>★</span><b id="starCount">0</b></div>
    <button class="ibtn" id="hGear" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5-.1-3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.5-1.5L15 1.5h-4l-.4 2.4A8 8 0 0 0 8 5.4l-2.4-.9-2 3.4 2 1.6a8 8 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a8 8 0 0 0 2.5-1.5l2.4.9 2-3.4z"/></svg></button>
  </div>
  <div class="panel">
    <div class="htabs" id="homeTabs"><button data-p="1">花园庄园</button><button data-p="2">林场牧场</button></div>
    <div class="phead"><b id="restoreHead">用星星修复庄园</b> <span id="restoreHint"></span></div>
    <div class="restore" id="restoreList"></div>
    <button class="big" id="btnPlay">开始 第 1 关</button>
    <div class="brow"><button class="small shopBtn" id="btnShop"><i class="gc"></i>商店</button><button class="small" id="btnLevels">选择关卡</button></div>
    <div class="brow"><button class="small ordBtn" id="btnOrders">订单<em class="dot hidden" id="ordDot"></em></button><button class="small crewBtn" id="btnCrew">雇工</button></div>
  </div>
</div>

<div id="pause" class="modal hidden"><div class="card">
  <h2>暂停</h2>
  <div class="note center" id="pauseInfo"></div>
  <button class="big" id="btnResume">继续</button>
  <button class="small" id="btnPSettings">设置</button>
  <button class="small" id="btnPLevels">选择关卡</button>
  <button class="small warm" id="btnHome">回到庄园</button>
</div></div>

<div id="levels" class="modal hidden"><div class="card wide">
  <h2>选择关卡</h2>
  <div class="grid" id="levelGrid"></div>
  <button class="small" data-close>关闭</button>
</div></div>

<div id="settings" class="modal hidden"><div class="card">
  <h2>设置</h2>
  <label class="row"><span>声音</span><input type="checkbox" id="optSound"><i class="sw"></i></label>
  <label class="row"><span>震动</span><input type="checkbox" id="optVib"><i class="sw"></i></label>
  <div class="note" id="storeNote"></div>
  <button class="small danger" id="btnReset">重置全部进度</button>
  <button class="big" data-close>好的</button>
</div></div>

<div id="shop" class="modal hidden"><div class="card wide shopCard">
  <div class="shopHead"><h2>商店</h2><div class="coinPill"><i class="gc"></i><b id="shopCoins">0</b></div><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="htabs" id="shopTabs"><button data-t="outfit" class="on">服装</button><button data-t="deco">装饰</button><button data-t="uni">制服</button></div>
  <div class="shopBody">
    <div class="pv"><canvas id="shopPrev"></canvas><div class="pvside"><div class="pvName" id="shopName"></div><div class="pvSub" id="shopSub"></div><button class="small warm" id="shopAct">购买</button></div></div>
    <div class="sgrid" id="shopGrid"></div>
  </div>
  <div class="note" id="shopHow">过关就能拿金币：每关保底 10 + 本关收入的 2% + 每颗星 10；第一次拿到的星星每颗再 +20。</div>
</div></div>

<div id="orders" class="modal hidden"><div class="card wide ordCard">
  <div class="shopHead"><h2>村民订单</h2><div class="coinPill"><i class="gc"></i><b id="ordCoins">0</b></div><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="ordList" id="ordList"></div>
  <div class="note" id="ordNote">每天 3 张新订单。在任何关卡里卖出 / 做出的东西都算数；每天可以换掉 1 张。</div>
</div></div>

<div id="crew" class="modal hidden"><div class="card wide ordCard">
  <div class="shopHead"><h2>我的雇工</h2><button class="xclose" data-close aria-label="关闭">✕</button></div>
  <div class="crewList" id="crewList"></div>
  <div class="note">关卡里雇来的工人就是他们（每关轮流上岗）。送货越多经验越多，等级越高特长越强（1 级 +5% → 10 级 +30%）。</div>
</div></div>

<div id="win" class="modal hidden"><div class="card win">
  <div class="ribbon" id="winTitle">第 1 关 完成！</div>
  <div class="starsBig" id="winStars"><i></i><i></i><i></i></div>
  <div class="wstat" id="winStat"></div>
  <button class="big" id="btnNext">继续</button>
</div></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
