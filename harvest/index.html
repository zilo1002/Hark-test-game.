<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4C553">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>半亩·丰收</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4C553'/%3E%3Cellipse cx='16' cy='17' rx='8' ry='10' fill='%23FFF3D6' stroke='%23C9A066' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="coin" id="coin"><span class="billIco"></span><b id="money">0</b></div>
  <div class="goal">
    <div class="lv" id="lvName">第 1 关</div>
    <div class="gtext" id="goalText"></div>
    <div class="bar"><i id="goalBar"></i><span id="goalNum"></span></div>
  </div>
  <div class="hbtns">
    <button class="ibtn" id="btnHome" aria-label="回到农场"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg></button>
    <button class="ibtn" id="btnGear" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5-.1-3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.5-1.5L15 1.5h-4l-.4 2.4A8 8 0 0 0 8 5.4l-2.4-.9-2 3.4 2 1.6a8 8 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a8 8 0 0 0 2.5-1.5l2.4.9 2-3.4z"/></svg></button>
  </div>
</div>

<div id="tip" class="tip hidden"></div>
<div id="banner" class="banner hidden"><div class="bl" id="bannerLv"></div><div class="bg" id="bannerGoal"></div></div>

<div id="home" class="screen hidden">
  <div class="topbar">
    <div class="title">我的农场</div>
    <div class="starPill"><span>★</span><b id="starCount">0</b></div>
    <button class="ibtn" id="hGear" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5-.1-3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.5-1.5L15 1.5h-4l-.4 2.4A8 8 0 0 0 8 5.4l-2.4-.9-2 3.4 2 1.6a8 8 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a8 8 0 0 0 2.5-1.5l2.4.9 2-3.4z"/></svg></button>
  </div>
  <div class="panel">
    <div class="phead">用星星修好农场 <span id="restoreHint"></span></div>
    <div class="restore" id="restoreList"></div>
    <button class="big" id="btnPlay">开始 第 1 关</button>
    <button class="small" id="btnLevels">选择关卡</button>
  </div>
</div>

<div id="levels" class="modal hidden"><div class="card">
  <h2>选择关卡</h2>
  <div class="grid" id="levelGrid"></div>
  <button class="small" data-close>关闭</button>
</div></div>

<div id="settings" class="modal hidden"><div class="card">
  <h2>设置</h2>
  <label class="row"><span>声音</span><input type="checkbox" id="optSound"><i class="sw"></i></label>
  <label class="row"><span>震动</span><input type="checkbox" id="optVib"><i class="sw"></i></label>
  <div class="note" id="storeNote"></div>
  <button class="small danger" id="btnReset">重置全部进度</button>
  <button class="big" data-close>好的</button>
</div></div>

<div id="win" class="modal hidden"><div class="card win">
  <div class="ribbon" id="winTitle">第 1 关 完成！</div>
  <div class="starsBig" id="winStars"><i></i><i></i><i></i></div>
  <div class="wstat" id="winStat"></div>
  <button class="big" id="btnNext">继续</button>
</div></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
