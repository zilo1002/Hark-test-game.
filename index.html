<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E110F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>半亩 · 种菜，卖菜，雇人替你干活</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E110F'/%3E%3Cpath d='M6 24 L26 24 M16 24 L16 10 M16 14 C12 12 10 12 8 14 M16 12 C20 9 23 9 25 11' stroke='%23BFA57A' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="fireflies" aria-hidden="true"></div>

<div id="app">
  <header id="hud">
    <div class="hrow top">
      <div id="manorBox" class="manor">庄园 <span class="lvtxt">Lv <b id="manorLv">1</b></span></div>
      <div id="manorNext" class="mute small"></div>
      <button id="gearBtn" class="icon-btn" aria-label="设置"></button>
    </div>
    <div class="hair"><i id="manorBar"></i></div>
    <div class="hrow stats">
      <div id="coinsBox" class="stat coins"><span id="coinIco" class="ico"></span><b id="coins">0</b></div>
      <div id="barnBox" class="stat barn"><span id="barnIco" class="ico"></span><b id="barnUsed">0</b><span class="cap">/<span id="barnCap">30</span></span></div>
      <div class="stat rate"><span class="lab">每分钟收入</span><b id="perMin">0</b></div>
    </div>
  </header>

  <main>
    <section class="view" id="view-field">
      <div id="scenery"></div>
      <div id="hint"></div>
      <div class="fieldWrap"><div id="field"></div></div>
      <div class="fieldFoot">
        <button id="quickSell" class="btn gold" data-act="sellAll">全部卖出 · 约 <b id="qsVal">0</b> 金币</button>
      </div>
    </section>
    <section class="view scroll" id="view-market"><div id="marketPanel" class="panel-inner"></div></section>
    <section class="view scroll" id="view-tools"><div class="panel-inner"><p class="lead">好工具，一下顶十下。</p><div id="toolsPanel"></div></div></section>
    <section class="view scroll" id="view-workers"><div class="panel-inner"><p class="lead">雇几个人，坐在田埂上看他们干活。</p><div id="workersPanel"></div></div></section>
  </main>

  <nav id="tabs">
    <button data-tab="field"><span class="ti"></span><span>田地</span></button>
    <button data-tab="market"><span class="ti"></span><span>集市</span></button>
    <button data-tab="tools"><span class="ti"></span><span>工具</span></button>
    <button data-tab="workers"><span class="ti"></span><span>雇工</span></button>
  </nav>
</div>

<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<div id="sheet" aria-hidden="true">
  <div class="backdrop"></div>
  <div class="panel scroll"></div>
</div>

<div id="start">
  <div class="startInner">
    <svg class="startArt" viewBox="0 0 200 90" fill="none" stroke="#E8E1D2" stroke-linecap="round" stroke-width="1">
      <circle cx="158" cy="22" r="8" stroke-opacity=".8"/>
      <path d="M10 70 C60 60 140 62 190 70" stroke-opacity=".35"/>
      <path d="M30 80 C80 74 130 76 180 80" stroke-opacity=".2"/>
      <path d="M70 70 L70 52 M70 58 C64 54 60 54 57 56 M70 55 C76 50 80 50 83 52" stroke="#8E9C7A"/>
      <path d="M100 68 L100 44 M100 52 C92 48 88 48 84 51 M100 48 C108 43 112 43 116 46" stroke="#8E9C7A"/>
      <path d="M130 70 L130 56 M130 60 C125 57 122 57 120 59" stroke="#8E9C7A"/>
    </svg>
    <h1>半亩</h1>
    <p class="sub">种菜，卖菜，雇人替你干活</p>
    <button id="startBtn" class="btn gold big">下地</button>
    <p style="margin-top:18px;font-size:13px;opacity:.75"><a href="./harvest/" style="color:#BFA57A;text-decoration:none;border-bottom:1px solid currentColor">另一个小游戏：半亩·丰收 ›</a></p>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
